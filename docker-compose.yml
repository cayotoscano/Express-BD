services:
  postgres:
    image: postgres:17
    container_name: devflix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: devflix
      # Esta senha e apenas para desenvolvimento local; use um segredo seguro em producao.
      POSTGRES_PASSWORD: devflix123
      POSTGRES_DB: devflix_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devflix -d devflix_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
