services:
  users-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: users_db
    ports:
      - '5432:5432'
    volumes:
      - users_v2_data:/var/lib/postgresql/data
  orders-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: orders_db
    ports:
      - '5433:5432'
    volumes:
      - orders_data:/var/lib/postgresql/data
volumes:
  users_v2_data:
  orders_data:
